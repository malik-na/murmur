[package]
name = "murmur"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hold a key, speak, and polished text lands in whatever app you're typing in. Fully local voice dictation for macOS."

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
crossbeam-channel = "0.5"
regex = "1"
once_cell = "1"

# storage
rusqlite = { version = "0.37", features = ["bundled"] }

# audio + speech
cpal = "0.16"
whisper-rs = { version = "0.15", features = ["metal", "log_backend"] }

# optional LLM cleanup (Anthropic API, only used when ANTHROPIC_API_KEY is set)
ureq = { version = "3", features = ["json"] }

# UI
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.33"
egui-phosphor = "0.11"
tray-icon = "0.21"

# macOS system integration
arboard = "3"
security-framework = "3"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSSound", "NSApplication", "NSWindow", "NSResponder"] }

[profile.release]
opt-level = 3
lto = "thin"
